.page{max-width:940px;margin:0 auto;background:rgba(255,255,255,.95);border-radius:16px;box-shadow:0 6px 24px #0003;overflow:hidden}
header{display:flex;gap:20px;align-items:center;padding:16px 22px;border-bottom:5px solid var(--o);flex-wrap:wrap}
.logo{text-align:center}
.logo img{display:block;width:auto;height:auto;max-width:100%;margin:0 auto}
.by{font:600 1rem Fredoka,sans-serif;color:var(--b);margin-top:4px}
.ttl{flex:1;min-width:250px}
.tag{display:inline-block;background:var(--b);color:#fff;font:600 1.1rem Fredoka,sans-serif;padding:2px 14px;border-radius:6px 6px 6px 0}
h1{font:600 1.6rem/1.2 Fredoka,sans-serif;color:var(--b);margin:8px 0}
.lead{margin:0 0 10px;font-size:.95rem}
.btn{font:600 1rem Fredoka,sans-serif;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;color:#fff;background:var(--b)}
.btn.o{background:var(--o)}.btn.g{background:#6b7b88}.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--o);outline-offset:2px}
main{padding:6px 22px}
.ex{padding:16px 0;border-bottom:2px dotted #b9c9d6}
.ex h2{font:500 1.05rem/1.4 Fredoka,sans-serif;display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.n{background:var(--b);color:#fff;min-width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:600}
.ex h2 span:last-child{font-weight:500}
.ex ul{margin:4px 0 4px 18px;padding:0}
.bd{padding-left:38px}
.g1{display:grid;grid-auto-flow:column;grid-template-rows:repeat(4,auto);gap:8px 40px;max-width:560px}
.row{margin:6px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.row b{color:var(--b);min-width:20px}
input.t{width:96px;font:700 1rem Nunito,sans-serif;text-align:center;border:2px solid #9bb7cc;border-radius:8px;padding:5px;background:#fff}
select{font:700 .9rem Nunito,sans-serif;border:2px solid #9bb7cc;border-radius:8px;padding:5px;background:#fff}
textarea{width:100%;font:1rem Nunito,sans-serif;border:2px solid #9bb7cc;border-radius:8px;padding:8px;margin-top:8px}
input.ok,select.ok{border-color:var(--ok);background:#e3f6e8;color:#13702f}
input.ko,select.ko{border-color:var(--ko);background:#fde6e6;color:#a31515}
.sc{overflow-x:auto}
table{border-collapse:collapse;background:#fff}
th{background:var(--p);font-weight:700}
th,td{border:1.5px solid #888;padding:6px 10px;text-align:center}
.opts.ok{outline:3px solid var(--ok)}.opts.ko{outline:3px solid var(--ko)}
.opts.ok tr:has(input:checked){background:#e3f6e8}.opts.ko tr:has(input:checked){background:#fde6e6}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;gap:8px;align-items:center;background:var(--bl);border-radius:10px;padding:6px 10px}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sw{font:600 .9rem Fredoka,sans-serif;border:3px solid transparent;border-radius:8px;padding:6px 12px;cursor:pointer}
.sw.on{border-color:#222;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--o)}
.turtle{position:relative;max-width:520px;padding-right:80px;margin:10px 0}
.shell{background:#cfe8cf;border:4px solid #333;border-radius:50% 50% 45% 45%/58% 58% 42% 42%;padding:30px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.head{position:absolute;right:0;top:34%;width:84px;height:58px;background:#cfe8cf;border:4px solid #333;border-radius:50% 60% 60% 50%}
.head::after{content:"";position:absolute;right:20px;top:14px;width:9px;height:9px;border-radius:50%;background:#222}
.tile{position:relative;font:800 1rem Nunito,sans-serif;border:3px solid #333;border-radius:14px;padding:10px 2px;background:#fff;cursor:pointer}
.tile.ok{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}.tile.ko{border-color:var(--ko);box-shadow:0 0 0 3px var(--ko)}
.tile.ok::after,.tile.ko::after{position:absolute;right:-8px;top:-10px;width:20px;height:20px;border-radius:50%;color:#fff;font-size:.8rem;line-height:20px}
.tile.ok::after{content:"✓";background:var(--ok)}.tile.ko::after{content:"✗";background:var(--ko)}
.u{font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:18px 22px;background:var(--bl)}
#score{font:600 1.15rem Fredoka,sans-serif;color:var(--b)}
#corr{display:none;padding:10px 22px 20px;background:#fffaf3;border-top:5px solid var(--o)}
#corr.show{display:block}
#corr h3{font:600 1.1rem Fredoka,sans-serif;color:var(--b);display:flex;gap:10px;align-items:center;margin:18px 0 6px}
.it{margin:6px 0;padding:8px 12px;background:#fff;border-left:5px solid var(--ok);border-radius:0 8px 8px 0}
.a{color:#13702f;font-weight:800}
footer{display:flex;justify-content:space-between;align-items:center;padding:8px 22px;font:600 .9rem Fredoka,sans-serif;color:var(--b)}
footer span:last-child{background:var(--o);color:#fff;padding:3px 14px;border-radius:6px}
@media(max-width:560px){.g1{grid-auto-flow:row;grid-template-rows:none}.bd{padding-left:0}h1{font-size:1.3rem}}
</style>
</head>
